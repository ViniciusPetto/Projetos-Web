<!-- Foram utilizadas classes do Bootstrap para estilização no formulário abaixo -->
<form action="../app/controller/cadastro.php" method="POST">
    <fieldset>
        <legend>Cadastro de Alunos</legend>
        <label for="fieldText" class="form-label mb-0">Nome*</label>
        <input type="text" name="nome" class="form-control" id="fieldText" placeholder="Digite o nome do aluno(a)"> <br>
                            
        <label for="fieldText" class="form-label mb-0">RA*</label>
        <input type="number" name="ra" class="form-control" id="fieldText" placeholder="Digite o RA do aluno(a)"> <br>
                            
        <label for="fieldText" class="form-label mb-0">Sexo*</label>
        <input type="text" name="sexo" class="form-control" id="fieldText" placeholder="Digite o sexo do aluno(a)"> <br>

        <label for="fieldText" class="form-label mb-0">Idade*</label>
        <input type="number" name="idade" class="form-control" id="fieldText" placeholder="Digite a idade do aluno(a)"> <br>

        <label for="fieldText" class="form-label mb-0">Endereço*</label>
        <input type="text" name="endereco" class="form-control" id="fieldText" placeholder="Digite o endereço do aluno(a)"> <br>

        <label for="fieldText" class="form-label mb-0">Telefone*</label>
        <input type="tel" name="telefone" class="form-control" id="fieldText" placeholder="Digite o telefone do aluno(a)"> <br>

        <label for="fieldText" class="form-label mb-0">E-mail*</label>
        <input type="email" name="email" class="form-control" id="fieldText" placeholder="Digite o e-mail do aluno(a)"> <br>

        <div class="form-text">
            Todos os campos com * são de preenchimento obrigatório!
        </div>

        <br>

        <button type="submit" class="theme-secondary btn-outline">
            Cadastrar
        </button>     
    </fieldset>   
</form>
